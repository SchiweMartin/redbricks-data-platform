bundle:
  name: redbricks
  engine: direct
  
include:
    - resources/*.yml

variables:
  catalog:
    description: "Unity-Catalog-Catalog der Umgebung"

targets:
  dev:
    variables:
      catalog: redbricks_dev
    mode: development
    default: true
    workspace:
      host: https://dbc-f803e55c-ced8.cloud.databricks.com

  test:
    variables:
      catalog: redbricks_test
    mode: production
    workspace:
      host: https://dbc-f803e55c-ced8.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    presets:
      trigger_pause_status: PAUSED
      name_prefix: "[test] "

  prod:
    variables:
      catalog: redbricks_prod
    mode: production
    workspace:
      host: https://dbc-f803e55c-ced8.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    presets:
      name_prefix: "[prod] "
    resources:
      schemas:
        eingang:
          lifecycle:
            prevent_destroy: true
        betrieb:
          lifecycle:
            prevent_destroy: true
      volumes:
        batches:
          lifecycle:
            prevent_destroy: true
bundle:
  name: redbricks

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-f803e55c-ced8.cloud.databricks.com

  test:
    mode: production
    workspace:
      host: https://dbc-f803e55c-ced8.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    presets:
      trigger_pause_status: PAUSED
      name_prefix: "[test] "

  prod:
    mode: production
    workspace:
      host: https://dbc-f803e55c-ced8.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    presets:
      name_prefix: "[prod] "